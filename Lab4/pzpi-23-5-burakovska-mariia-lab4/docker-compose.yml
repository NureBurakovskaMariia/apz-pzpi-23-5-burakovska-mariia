version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: pet_shelter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  server:
    build: .
    expose:
      - "3000"
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db            
      DB_USER: postgres
      DB_PASSWORD: 1
      DB_NAME: pet_shelter
      DB_PORT: 5432         
      REDIS_URL: redis://redis:6379  
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server